name: Frontend CI

on:
  pull_request:
    branches: [dev, prod]
  push:
    branches: [dev, prod]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.23.2"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Build frontend
        run: npm run build

      - name: Upload frontend artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ github.sha }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
  publish-dev:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'

    permissions:
      contents: read
      actions: read
      id-token: write

    uses: ./.github/workflows/publish-s3.yml

    with:
      role-arn: arn:aws:iam::989200477899:role/dealengine-dev-github-s3-publisher
      aws-region: us-east-2
      bucket: deal-engine-ticket-manager-dev-1583tta4
      artifact-name: frontend-dist-${{ github.sha }}-${{ github.run_attempt }}